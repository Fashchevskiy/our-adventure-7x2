<!DOCTYPE html>
<html lang="uk">
<head>

<body>

        <b data-a="attack">⚔</b>
        <b data-a="jump">JUMP</b>
    </div>
</div>

<div id="start">
    <h1>Our Little Adventure ❤️</h1>

    <button class="big" id="go">START</button>
    <button class="big sm" id="reset">Нова гра</button>

    <p>
        ПК: A/D рух · Space стрибок · Shift біг · J/K атака · E взаємодія
    </p>
</div>

<div id="rotate">
    <div style="font-size:64px">📱↻</div>
    <h2>Поверни телефон горизонтально ❤️</h2>
</div>

<script>

// ============================================================
// INPUT
// ============================================================

const input = {
    ax: 0,
    jump: false,
    attack: false,
    interact: false,
    run: false
};

const kb = {};
const tc = {};

let joyAx = 0;

const M = {
    KeyA: "l",
    ArrowLeft: "l",

    KeyD: "r",
    ArrowRight: "r",

    Space: "jump",
    KeyW: "jump",
    ArrowUp: "jump",

    KeyJ: "attack",
    KeyK: "attack",

    KeyE: "interact",

    ShiftLeft: "run"
};

addEventListener("keydown", e => {
    if (M[e.code]) {
        kb[M[e.code]] = 1;
        e.preventDefault();
    }
});

addEventListener("keyup", e => {
    if (M[e.code]) {
        kb[M[e.code]] = 0;
    }
});

addEventListener("blur", () => {
    for (const k in kb) {
        kb[k] = 0;
    }
});

function poll() {
    const k = (kb.r ? 1 : 0) - (kb.l ? 1 : 0);

    input.ax = k || joyAx;

    input.run =
        !!kb.run ||
        (!k && Math.abs(joyAx) > 0.85);

    for (const a of ["jump", "attack", "interact"]) {
        input[a] = !!(kb[a] || tc[a]);
    }
}


// ============================================================
// TOUCH CONTROLS
// ============================================================

function initTouch() {
    const joy = document.getElementById("joy");
    const knob = joy.firstElementChild;

    let id = null;

    const set = e => {
        const r = joy.getBoundingClientRect();
        const R = r.width / 2;
        const m = R * 0.6;

        const dx = Math.max(
            -m,
            Math.min(
                m,
                e.clientX - (r.left + R)
            )
        );

        joyAx = Math.abs(dx) < m * 0.2
            ? 0
            : dx / m;

        knob.style.transform = `translateX(${dx}px)`;
    };

    const end = e => {
        if (e.pointerId === id) {
            id = null;
            joyAx = 0;
            knob.style.transform = "";
        }
    };

    joy.addEventListener("pointerdown", e => {
        id = e.pointerId;
        joy.setPointerCapture(id);
        set(e);
    });

    joy.addEventListener("pointermove", e => {
        if (e.pointerId === id) {
            set(e);
        }
    });

    joy.addEventListener("pointerup", end);
    joy.addEventListener("pointercancel", end);

    document
        .querySelectorAll("#btns b")
        .forEach(b => {
            const a = b.dataset.a;

            b.addEventListener("pointerdown", e => {
                tc[a] = 1;
                b.setPointerCapture(e.pointerId);
            });

            const up = () => {
                tc[a] = 0;
            };

            b.addEventListener("pointerup", up);
            b.addEventListener("pointercancel", up);
        });

    addEventListener("contextmenu", e => {
        e.preventDefault();
    });
}


// ============================================================
// PLAYER
// ============================================================

const HEAD_W = 84;
const HEAD_LIFT = 0;

class Player {

    constructor(
        x,
        y,
        headFile = "assets/characters/dasha_head.png",
        color = "#ff6fa5",
        dress = true
    ) {
        Object.assign(this, {
            x,
            y,
            prevY: y,

            vx: 0,
            vy: 0,

            w: 44,
            h: 110,

            face: 1,

            ground: false,
            t: 0,
            prevJump: false,

            atk: 0,
            swing: 0,

            hp: 5,
            inv: 0,

            kb: 0,

            color,
            dress
        });

        const i = new Image();

        i.onload = () => {
            this.head = i;
        };

        i.src = headFile;
    }

    update(dt, inp, solids) {

        this.t += dt;
        this.inv -= dt;

        const sp = inp.run ? 400 : 250;

        this.vx = inp.ax * sp + this.kb;

        this.kb *= Math.pow(0.001, dt);

        if (inp.ax) {
            this.face = Math.sign(inp.ax);
        }

        if (
            inp.jump &&
            !this.prevJump &&
            this.ground
        ) {
            this.vy = -800;
            this.ground = false;
        }

        this.prevJump = inp.jump;

        if (
            inp.attack &&
            this.atk <= 0
        ) {
            this.atk = 0.25;
            this.swing++;
        }

        this.atk -= dt;

        this.vy = Math.min(
            this.vy + 1900 * dt,
            1200
        );

        this.x += this.vx * dt;

        for (const s of solids) {

            if (!s.p && this.hit(s)) {
                this.x = this.vx > 0
                    ? s.x - this.w / 2
                    : s.x + s.w + this.w / 2;
            }
        }

        this.prevY = this.y;
        this.y += this.vy * dt;

        this.ground = false;

        for (const s of solids) {

            if (this.hit(s)) {

                if (
                    s.p &&
                    !(
                        this.vy >= 0 &&
                        this.prevY <= s.y + 2
                    )
                ) {
                    continue;
                }

                if (this.vy >= 0) {
                    this.y = s.y;
                    this.ground = true;
                } else if (!s.p) {
                    this.y =
                        s.y +
                        s.h +
                        this.h;
                }

                this.vy = 0;
            }
        }
    }

    hit(s) {
        return (
            this.x + this.w / 2 > s.x &&
            this.x - this.w / 2 < s.x + s.w &&
            this.y > s.y &&
            this.y - this.h < s.y + s.h
        );
    }

    box() {
        const a = this.x;
        const b = this.x + this.face * 95;

        return {
            x1: Math.min(a, b),
            x2: Math.max(a, b),
            y1: this.y - 110,
            y2: this.y
        };
    }

    hurt(d, dir) {

        if (this.inv > 0) {
            return;
        }

        this.hp -= d;
        this.inv = 1.2;

        this.kb = dir * 450;
        this.vy = -350;

        this.ground = false;
    }

    draw(c) {

        if (
            this.inv > 0 &&
            Math.floor(this.t * 20) % 2
        ) {
            return;
        }

        const mv =
            Math.abs(this.vx) > 10 &&
            this.ground;

        const sw = mv
            ? Math.sin(
                this.t *
                (
                    Math.abs(this.vx) > 300
                        ? 22
                        : 14
                )
            )
            : 0;

        c.save();

        c.translate(this.x, this.y);
        c.scale(this.face, 1);

        // Legs
        c.fillStyle =
            this.dress
                ? "#f2c9a5"
                : "#2c3e66";

        c.fillRect(
            -13 + sw * 9,
            -24,
            9,
            24
        );

        c.fillRect(
            4 - sw * 9,
            -24,
            9,
            24
        );

        // Body
        c.fillStyle = this.color;

        c.beginPath();

        if (this.dress) {

            c.moveTo(-14, -62);
            c.lineTo(14, -62);
            c.lineTo(26, -20);
            c.lineTo(-26, -20);

        } else {

            c.moveTo(-16, -64);
            c.lineTo(16, -64);
            c.lineTo(16, -22);
            c.lineTo(-16, -22);
        }

        c.fill();

        // Head
        const hy =
            -60 +
            (
                mv
                    ? -Math.abs(sw) * 4
                    : 0
            ) +
            HEAD_LIFT;

        if (this.head) {

            const hh =
                HEAD_W *
                this.head.height /
                this.head.width;

            c.drawImage(
                this.head,
                -HEAD_W / 2,
                hy - hh,
                HEAD_W,
                hh
            );

        } else {

            // Fallback face
            c.fillStyle =
                this.dress
                    ? "#5a3420"
                    : "#2a2018";

            c.beginPath();
            c.arc(
                0,
                hy - 38,
                34,
                0,
                7
            );
            c.fill();

            c.fillStyle = "#f2c9a5";

            c.beginPath();
            c.arc(
                0,
                hy - 34,
                28,
                0,
                7
            );
            c.fill();

            c.fillStyle = "#222";

            c.fillRect(
                6,
                hy - 40,
                5,
                7
            );

            c.fillRect(
                -9,
                hy - 40,
                5,
                7
            );

            c.strokeStyle = "#c0505a";
            c.lineWidth = 2;

            c.beginPath();

            c.arc(
                0,
                hy - 28,
                6,
                0.2,
                2.9
            );

            c.stroke();
        }

        // Attack animation
        if (this.atk > 0) {

            c.strokeStyle = "#fff";
            c.globalAlpha =
                Math.min(
                    1,
                    this.atk * 4
                );

            c.lineWidth = 6;

            c.beginPath();

            c.arc(
                20,
                -60,
                60,
                -1.2,
                1.2
            );

            c.stroke();

            c.globalAlpha = 1;
        }

        c.restore();
    }
}


// ============================================================
// ENEMY
// ============================================================

class Enemy {

    constructor(type, x, y, range) {

        const f = type === "fox";

        Object.assign(this, {
            type,

            x,
            y,

            x0: x - range,
            x1: x + range,

            hp: f ? 2 : 5,

            w: f ? 54 : 86,
            h: f ? 36 : 58,

            dir: 1,

            dmg: f ? 1 : 2,

            t: 0,
            stun: 0,
            kv: 0,

            swing: -1,

            flash: 0,

            dead: false
        });
    }

    update(dt, p) {

        this.t += dt;
        this.flash -= dt;

        if (this.stun > 0) {

            this.stun -= dt;
            this.x += this.kv * dt;
            this.kv *= 0.9;

            return;
        }

        const fox =
            this.type === "fox";

        const d =
            p.x - this.x;

        const near =
            Math.abs(p.y - this.y) < 90;

        let sp =
            fox ? 100 : 70;

        if (
            near &&
            Math.abs(d) <
                (fox ? 260 : 380)
        ) {

            this.dir =
                Math.sign(d) || 1;

            sp =
                fox ? 190 : 300;

        } else {

            if (this.x > this.x1) {
                this.dir = -1;
            }

            if (this.x < this.x0) {
                this.dir = 1;
            }
        }

        this.x +=
            this.dir *
            sp *
            dt;
    }

    draw(c) {

        const sw =
            Math.sin(this.t * 14) * 6;

        c.save();

        c.translate(
            this.x,
            this.y
        );

        c.scale(
            this.dir,
            1
        );

        if (
            this.flash > 0 &&
            Math.floor(
                this.t * 30
            ) % 2
        ) {
            c.globalAlpha = 0.4;
        }

        if (this.type === "fox") {

            // FOX

            c.fillStyle = "#d9742c";

            c.fillRect(
                -18 + sw,
                -12,
                7,
                12
            );

            c.fillRect(
                12 - sw,
                -12,
                7,
                12
            );

            c.beginPath();

            c.ellipse(
                0,
                -20,
                26,
                14,
                0,
                0,
                7
            );

            c.fill();

            c.beginPath();

            c.ellipse(
                -30,
                -26,
                16,
                8,
                -0.5,
                0,
                7
            );

            c.fill();

            c.fillStyle = "#fff";

            c.beginPath();

            c.arc(
                -42,
                -30,
                6,
                0,
                7
            );

            c.fill();

            c.fillStyle = "#e8803a";

            c.beginPath();

            c.arc(
                24,
                -28,
                12,
                0,
                7
            );

            c.fill();

            c.beginPath();

            c.moveTo(
                16,
                -36
            );

            c.lineTo(
                20,
                -52
            );

            c.lineTo(
                26,
                -38
            );

            c.fill();

            c.beginPath();

            c.moveTo(
                26,
                -38
            );

            c.lineTo(
                32,
                -50
            );

            c.lineTo(
                34,
                -34
            );

            c.fill();

            c.fillStyle = "#222";

            c.fillRect(
                28,
                -31,
                4,
                4
            );

            c.fillRect(
                34,
                -26,
                4,
                4
            );

        } else {

            // BOAR

            c.fillStyle = "#4a3022";

            c.fillRect(
                -30 + sw,
                -16,
                10,
                16
            );

            c.fillRect(
                22 - sw,
                -16,
                10,
                16
            );

            c.fillStyle = "#6b4a3a";

            c.beginPath();

            c.ellipse(
                0,
                -36,
                42,
                26,
                0,
                0,
                7
            );

            c.fill();

            c.fillStyle = "#3a2418";

            for (
                let i = -30;
                i < 30;
                i += 12
            ) {

                c.beginPath();

                c.moveTo(
                    i,
                    -58
                );

                c.lineTo(
                    i + 6,
                    -72
                );

                c.lineTo(
                    i + 12,
                    -58
                );

                c.fill();
            }

            c.fillStyle = "#7a5645";

            c.beginPath();

            c.arc(
                38,
                -32,
                18,
                0,
                7
            );

            c.fill();

            c.fillStyle = "#fff";

            c.beginPath();

            c.moveTo(
                46,
                -24
            );

            c.lineTo(
                62,
                -34
            );

            c.lineTo(
                52,
                -18
            );

            c.fill();

            c.fillStyle = "#222";

            c.fillRect(
                40,
                -40,
                5,
                5
            );
        }

        c.restore();
    }
}


// ============================================================
// FOREST
// ============================================================

const W = 6000;
const GY = 620;

function heart(c, x, y, s, col) {

    c.fillStyle = col;

    c.beginPath();

    c.moveTo(
        x,
        y + s * 0.6
    );

    c.bezierCurveTo(
        x - s * 1.2,
        y - s * 0.1,
        x - s * 0.6,
        y - s,
        x,
        y - s * 0.4
    );

    c.bezierCurveTo(
        x + s * 0.6,
        y - s,
        x + s * 1.2,
        y - s * 0.1,
        x,
        y + s * 0.6
    );

    c.fill();
}

function tree(c, x, y, h, col) {

    c.fillStyle = col;

    c.fillRect(
        x - 8,
        y - h * 0.3,
        16,
        h * 0.3
    );

    for (let k = 0; k < 3; k++) {

        const w =
            70 - k * 16;

        const b =
            y -
            h * 0.25 -
            k * h * 0.24;

        c.beginPath();

        c.moveTo(
            x - w,
            b
        );

        c.lineTo(
            x + w,
            b
        );

        c.lineTo(
            x,
            b - h * 0.38
        );

        c.fill();
    }
}

class Forest {

    constructor(save, onSave, goto) {

        Object.assign(this, {
            onSave,
            goto,

            t: 0,
            cam: 0,

            fx: [],

            left: false
        });

        this.solids = [
            {
                x: 0,
                y: GY,
                w: W,
                h: 200
            },

            ...[
                [700, 500],
                [1100, 420],
                [1500, 520],
                [2400, 470],
                [3300, 400],
                [4200, 480],
                [5000, 430]
            ].map(
                ([x, y]) => ({
                    x,
                    y,
                    w: 200,
                    h: 20,
                    p: true
                })
            )
        ];

        this.hearts = [
            [800, 450],
            [2500, 420],
            [4300, 430]
        ].map(
            ([x, y], i) => ({
                x,
                y,
                got: !!(
                    save.hearts &&
                    save.hearts[i]
                )
            })
        );

        this.player =
            new Player(
                120,
                GY
            );

        this.en = [
            ["fox", 900, 150],
            ["fox", 1700, 160],
            ["boar", 2200, 200],
            ["fox", 2900, 150],
            ["boar", 3500, 200],
            ["fox", 4000, 150],
            ["boar", 4700, 220],
            ["fox", 5200, 150]
        ].map(
            ([t, x, r]) =>
                new Enemy(
                    t,
                    x,
                    GY,
                    r
                )
        );

        this.ff =
            Array.from(
                { length: 40 },
                (_, i) => ({
                    x:
                        (i * 337) %
                        1380,

                    y:
                        150 +
                        (i * 91) %
                        450,

                    s:
                        0.6 +
                        (i % 5) * 0.2,

                    p: i
                })
            );
    }

    burst(x, y, n, c) {

        for (
            let i = 0;
            i < n;
            i++
        ) {

            this.fx.push({
                x,
                y,

                vx:
                    (Math.random() - 0.5) *
                    400,

                vy:
                    -Math.random() *
                    300,

                l: 0.7,
                c
            });
        }
    }

    update(dt, inp) {

        this.t += dt;

        const p =
            this.player;

        p.update(
            dt,
            inp,
            this.solids
        );

        p.x =
            Math.max(
                30,
                Math.min(
                    W - 30,
                    p.x
                )
            );

        // Hearts
        for (const h of this.hearts) {

            if (
                !h.got &&
                Math.abs(
                    h.x - p.x
                ) < 45 &&
                Math.abs(
                    h.y -
                    (p.y - 60)
                ) < 70
            ) {

                h.got = true;

                this.onSave({
                    hearts:
                        this.hearts.map(
                            q => q.got
                        )
                });

                for (
                    let i = 0;
                    i < 14;
                    i++
                ) {

                    this.fx.push({
                        x: h.x,
                        y: h.y,

                        vx:
                            (Math.random() - 0.5) *
                            300,

                        vy:
                            -Math.random() *
                            300,

                        l: 1,

                        h: true,

                        c: "#ff5082"
                    });
                }
            }
        }

        // Attack
        if (p.atk > 0.08) {

            const b =
                p.box();

            for (const e of this.en) {

                if (
                    !e.dead &&
                    e.swing !== p.swing &&
                    e.x + e.w / 2 > b.x1 &&
                    e.x - e.w / 2 < b.x2 &&
                    e.y > b.y1 &&
                    e.y - e.h < b.y2
                ) {

                    e.swing =
                        p.swing;

                    e.hp--;

                    e.stun = 0.3;
                    e.kv =
                        p.face * 400;

                    e.flash = 0.3;

                    this.burst(
                        e.x,
                        e.y - e.h / 2,
                        6,
                        "#fff"
                    );

                    if (e.hp <= 0) {

                        e.dead = true;

                        this.burst(
                            e.x,
                            e.y - e.h / 2,
                            14,
                            "#ffd36b"
                        );
                    }
                }
            }
        }

        // Enemies
        for (const e of this.en) {

            e.update(
                dt,
                p
            );

            if (
                e.stun <= 0 &&
                Math.abs(
                    p.x - e.x
                ) <
                    (p.w + e.w) / 2 &&
                p.y > e.y - e.h &&
                p.y - p.h < e.y
            ) {

                p.hurt(
                    e.dmg,
                    Math.sign(
                        p.x - e.x
                    ) || 1
                );
            }
        }

        this.en =
            this.en.filter(
                e => !e.dead
            );

        // Respawn
        if (p.hp <= 0) {

            p.hp = 5;

            p.x =
                Math.max(
                    120,
                    Math.floor(
                        p.x / 1500
                    ) * 1500
                );

            p.y =
                GY - 200;

            p.vy = 0;
            p.kb = 0;
        }

        // Effects
        for (const f of this.fx) {

            f.x +=
                f.vx * dt;

            f.y +=
                f.vy * dt;

            f.vy +=
                500 * dt;

            f.l -= dt;
        }

        this.fx =
            this.fx.filter(
                f => f.l > 0
            );

        this.open =
            this.hearts.every(
                h => h.got
            );

        if (
            this.open &&
            !this.left &&
            Math.abs(
                p.x - 5800
            ) < 50
        ) {

            this.left = true;

            this.goto(
                "meeting"
            );
        }

        const tg =
            Math.max(
                0,
                Math.min(
                    W - 1280,
                    p.x - 640
                )
            );

        this.cam +=
            (
                tg - this.cam
            ) *
            Math.min(
                1,
                dt * 5
            );
    }

    layer(
        c,
        f,
        gap,
        col,
        hb,
        y
    ) {

        const off =
            this.cam * f;

        const i0 =
            Math.floor(
                off / gap
            );

        for (
            let i = i0;
            i <
            i0 +
            1280 / gap +
            2;
            i++
        ) {

            tree(
                c,
                i * gap - off,
                y,
                hb +
                    (
                        (
                            i * 37 % 5 +
                            5
                        ) % 5
                    ) * 35,
                col
            );
        }
    }

    draw(c) {

        const g =
            c.createLinearGradient(
                0,
                0,
                0,
                720
            );

        g.addColorStop(
            0,
            "#2b1b5a"
        );

        g.addColorStop(
            0.55,
            "#e98fb5"
        );

        g.addColorStop(
            1,
            "#ffd6a5"
        );

        c.fillStyle = g;

        c.fillRect(
            0,
            0,
            1280,
            720
        );

        const sg =
            c.createRadialGradient(
                900,
                260,
                10,
                900,
                260,
                260
            );

        sg.addColorStop(
            0,
            "#fff3c4"
        );

        sg.addColorStop(
            1,
            "#fff3c400"
        );

        c.fillStyle = sg;

        c.fillRect(
            500,
            0,
            800,
            600
        );

        this.layer(
            c,
            0.2,
            220,
            "#6a3f93",
            300,
            650
        );

        this.layer(
            c,
            0.45,
            170,
            "#3f2a74",
            260,
            670
        );

        this.layer(
            c,
            0.75,
            230,
            "#241a4d",
            330,
            720
        );

        c.save();

        c.translate(
            -this.cam,
            0
        );

        const gr =
            c.createLinearGradient(
                0,
                GY,
                0,
                720
            );

        gr.addColorStop(
            0,
            "#3d7a46"
        );

        gr.addColorStop(
            1,
            "#1d3a2a"
        );

        for (
            const s of this.solids
        ) {

            c.fillStyle =
                s.p
                    ? "#6b4a3a"
                    : gr;

            c.fillRect(
                s.x,
                s.y,
                s.w,
                s.p
                    ? s.h
                    : 200
            );

            c.fillStyle =
                "#6fd07a";

            c.fillRect(
                s.x,
                s.y,
                s.w,
                8
            );
        }

        c.fillStyle =
            "#6fd07a";

        for (
            let x =
                Math.floor(
                    this.cam / 40
                ) * 40;

            x <
                this.cam + 1320;

            x += 40
        ) {

            const h =
                8 +
                (
                    (x / 40 * 7) % 3
                ) * 5;

            c.beginPath();

            c.moveTo(
                x,
                GY
            );

            c.lineTo(
                x + 6,
                GY - h
            );

            c.lineTo(
                x + 12,
                GY
            );

            c.fill();
        }

        // Hearts
        for (
            const h of this.hearts
        ) {

            if (!h.got) {

                heart(
                    c,
                    h.x,
                    h.y +
                        Math.sin(
                            this.t * 3 +
                            h.x
                        ) * 6,
                    26,
                    "#ff3b6f"
                );
            }
        }

        // Portal
        c.fillStyle =
            this.open
                ? "#ff9be0"
                : "#555";

        c.globalAlpha =
            this.open
                ? 0.7 +
                    0.2 *
                    Math.sin(
                        this.t * 4
                    )
                : 0.6;

        c.beginPath();

        c.ellipse(
            5800,
            GY - 90,
            45,
            90,
            0,
            0,
            7
        );

        c.fill();

        c.globalAlpha = 1;

        // Enemies
        for (
            const e of this.en
        ) {
            e.draw(c);
        }

        // Player
        this.player.draw(c);

        // Effects
        for (
            const f of this.fx
        ) {

            c.globalAlpha =
                Math.max(
                    0,
                    f.l
                );

            if (f.h) {

                heart(
                    c,
                    f.x,
                    f.y,
                    8,
                    f.c
                );

            } else {

                c.fillStyle =
                    f.c;

                c.beginPath();

                c.arc(
                    f.x,
                    f.y,
                    4,
                    0,
                    7
                );

                c.fill();
            }
        }

        c.globalAlpha = 1;

        c.restore();

        // Fireflies
        for (
            const f of this.ff
        ) {

            const x =
                (
                    (
                        f.x -
                        this.cam * 0.9
                    ) % 1380 +
                    1380
                ) % 1380 - 50;

            const y =
                f.y +
                Math.sin(
                    this.t * f.s +
                    f.p
                ) * 20;

            const a =
                0.5 +
                0.5 *
                Math.sin(
                    this.t * 2 +
                    f.p
                );

            c.fillStyle =
                `rgba(255,246,168,${0.15 * a})`;

            c.beginPath();

            c.arc(
                x,
                y,
                10,
                0,
                7
            );

            c.fill();

            c.fillStyle =
                `rgba(255,250,200,${0.4 + 0.5 * a})`;

            c.beginPath();

            c.arc(
                x,
                y,
                3,
                0,
                7
            );

            c.fill();
        }

        // Light rays
        c.fillStyle =
            "rgba(255,240,200,.07)";

        for (
            let i = 0;
            i < 4;
            i++
        ) {

            const x =
                200 +
                i * 300 +
                Math.sin(
                    this.t * 0.3 +
                    i
                ) * 30;

            c.beginPath();

            c.moveTo(
                x,
                0
            );

            c.lineTo(
                x + 90,
                0
            );

            c.lineTo(
                x + 330,
                720
            );

            c.lineTo(
                x + 150,
                720
            );

            c.fill();
        }

        // HUD
        const n =
            this.hearts.filter(
                h => h.got
            ).length;

        c.fillStyle =
            "#fff";

        c.font =
            "bold 26px system-ui,sans-serif";

        c.shadowColor =
            "#0008";

        c.shadowBlur = 6;

        c.fillText(
            `❤️ Hearts: ${n}/3`,
            40,
            52
        );

        c.fillText(
            "HP: " +
                "💗".repeat(
                    Math.max(
                        0,
                        this.player.hp
                    )
                ),
            40,
            90
        );

        if (
            this.player.x >
            5200
        ) {

            c.fillText(
                this.open
                    ? "Іди в портал ✨"
                    : "🔒 Збери всі 3 сердечка",
                500,
                100
            );
        }

        c.shadowBlur = 0;
    }
}
