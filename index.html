// MEETING
// ============================================================

class Meeting {

    constructor(
        save,
        onSave,
        goto
    ) {

        Object.assign(this, {
            goto,

            t: 0,

            state: "walk",
            st: 0,

            fx: [],
            hc: 0,

            end: false
        });

        this.solids = [
            {
                x: 0,
                y: GY,
                w: 1280,
                h: 200
            }
        ];

        this.p =
            new Player(
                100,
                GY
            );

        this.n =
            new Player(
                1000,
                GY,
                "assets/characters/me_head.png",
                "#4a8fe0",
                false
            );

        this.n.face = -1;

        this.stars =
            Array.from(
                { length: 80 },
                (_, i) => ({
                    x:
                        (i * 397) %
                        1280,

                    y:
                        (i * 173) %
                        420,

                    r:
                        1 +
                        (i % 3) * 0.6
                })
            );
    }

    update(dt, inp) {

        this.t += dt;

        const p = this.p;
        const n = this.n;

        n.update(
            dt,
            { ax: 0 },
            this.solids
        );

        if (
            this.state === "walk"
        ) {

            p.update(
                dt,
                inp,
                this.solids
            );

            p.x =
                Math.max(
                    40,
                    Math.min(
                        1240,
                        p.x
                    )
                );

            if (
                p.x >
                n.x - 170
            ) {

                this.state =
                    "meet";

                this.st = 0;
            }

        } else {

            this.st += dt;

            if (
                this.state === "meet"
            ) {

                p.update(
                    dt,
                    { ax: 0 },
                    this.solids
                );

                p.x +=
                    (
                        n.x -
                        95 -
                        p.x
                    ) *
                    Math.min(
                        1,
                        dt * 3
                    );

                p.face = 1;
                n.face = -1;

                this.hc -= dt;

                if (this.hc <= 0) {

                    this.hc = 0.18;

                    const mx =
                        (
                            p.x +
                            n.x
                        ) / 2;

                    this.fx.push({
                        x:
                            mx +
                            (
                                Math.random() -
                                0.5
                            ) * 120,

                        y:
                            GY - 200,

                        vy:
                            -70 -
                            Math.random() * 50,

                        l: 2.5
                    });
                }

                if (this.st > 6) {
                    this.state = "done";
                }

            } else {

                p.update(
                    dt,
                    inp,
                    this.solids
                );

                p.x =
                    Math.max(
                        40,
                        Math.min(
                            1240,
                            p.x
                        )
                    );

                if (
                    Math.abs(
                        p.x - 1190
                    ) < 50 &&
                    !this.end
                ) {

                    this.end = true;

                    this.goto(
                        "planet"
                    );
                }
            }
        }

        for (
            const f of this.fx
        ) {

            f.y +=
                f.vy * dt;

            f.l -= dt;
        }

        this.fx =
            this.fx.filter(
                f => f.l > 0
            );
    }

    draw(c) {

        const p = this.p;
        const n = this.n;
        const t = this.t;

        let k = 0;

        if (
            this.state === "meet"
        ) {

            k =
                Math.min(
                    1,
                    this.st / 2
                );

        } else if (
            this.state === "done"
        ) {

            k =
                Math.max(
                    0,
                    1 -
                    (
                        this.st - 6
                    ) / 1.5
                );
        }

        k =
            k * k *
            (3 - 2 * k);

        const g =
            c.createLinearGradient(
                0,
                0,
                0,
                720
            );

        g.addColorStop(
            0,
            "#0b0a2e"
        );

        g.addColorStop(
            0.7,
            "#3a1d5c"
        );

        g.addColorStop(
            1,
            "#7a3a6a"
        );

        c.fillStyle = g;

        c.fillRect(
            0,
            0,
            1280,
            720
        );

        c.save();

        c.translate(
            640,
            470
        );

        c.scale(
            1 + 0.55 * k,
            1 + 0.55 * k
        );

        c.translate(
            -(
                640 +
                (
                    (
                        p.x +
                        n.x
                    ) / 2 -
                    640
                ) * k
            ),
            -470
        );

        // Stars
        c.fillStyle =
            "#fff";

        for (
            const s of this.stars
        ) {

            c.globalAlpha =
                0.5 +
                0.5 *
                Math.sin(
                    t * 2 +
                    s.x
                );

            c.beginPath();

            c.arc(
                s.x,
                s.y,
                s.r,
                0,
                7
            );

            c.fill();
        }

        c.globalAlpha = 1;

        // Moon
        c.fillStyle =
            "#fff6d8";

        c.beginPath();

        c.arc(
            1000,
            130,
            46,
            0,
            7
        );

        c.fill();

        // Trees
        for (
            let i = -1;
            i < 9;
            i++
        ) {

            tree(
                c,
                i * 170 + 40,
                GY,
                330 +
                    (
                        (
                            i * 37 % 5 +
                            5
                        ) % 5
                    ) * 30,
                "#1b1440"
            );
        }

        for (
            let i = 0;
            i < 7;
            i++
        ) {

            tree(
                c,
                i * 210 + 110,
                GY + 30,
                280,
                "#2a1d5c"
            );
        }

        // Ground
        const gr =
            c.createLinearGradient(
                0,
                GY,
                0,
                720
            );

        gr.addColorStop(
            0,
            "#2f5f45"
        );

        gr.addColorStop(
            1,
            "#14301f"
        );

        c.fillStyle = gr;

        c.fillRect(
            -300,
            GY,
            1900,
            200
        );

        c.fillStyle =
            "#5fbf6b";

        c.fillRect(
            -300,
            GY,
            1900,
            6
        );

        // Tables
        c.fillStyle =
            "#6b4a3a";

        c.fillRect(
            330,
            GY - 34,
            150,
            14
        );

        c.fillRect(
            345,
            GY - 20,
            12,
            20
        );

        c.fillRect(
            455,
            GY - 20,
            12,
            20
        );

        c.fillRect(
            740,
            GY - 70,
            170,
            14
        );

        c.fillRect(
            755,
            GY - 56,
            12,
            56
        );

        c.fillRect(
            885,
            GY - 56,
            12,
            56
        );

        // Chairs / objects
        c.fillStyle =
            "#fff";

        c.fillRect(
            780,
            GY - 84,
            22,
            14
        );

        c.fillRect(
            840,
            GY - 84,
            22,
            14
        );

        // Fire
        const fl =
            1 +
            0.15 *
            Math.sin(t * 17) +
            0.1 *
            Math.sin(t * 9);

        const fg =
            c.createRadialGradient(
                620,
                GY - 30,
                5,
                620,
                GY - 30,
                220 * fl
            );

        fg.addColorStop(
            0,
            "rgba(255,170,60,.55)"
        );

        fg.addColorStop(
            1,
            "rgba(255,170,60,0)"
        );

        c.fillStyle = fg;

        c.fillRect(
            300,
            GY - 300,
            640,
            400
        );

        c.fillStyle =
            "#4a2f20";

        c.fillRect(
            585,
            GY - 12,
            70,
            12
        );

        c.fillStyle =
            "#ff7a1a";

        c.beginPath();

        c.ellipse(
            620,
            GY - 32,
            22 * fl,
            34 * fl,
            0,
            0,
            7
        );

        c.fill();

        c.fillStyle =
            "#ffd24a";

        c.beginPath();

        c.ellipse(
            620,
            GY - 26,
            12 * fl,
            22 * fl,
            0,
            0,
            7
        );

        c.fill();

        // Portal
        if (
            this.state === "done"
        ) {

            const a =
                Math.min(
                    1,
                    this.st - 6
                );

            c.globalAlpha =
                Math.max(
                    0,
                    a
                );

            c.fillStyle =
                "#ff9be0";

            c.beginPath();

            c.ellipse(
                1190,
                GY - 90,
                45,
                90,
                0,
                0,
                7
            );

            c.fill();

            c.globalAlpha = 1;
        }

        n.draw(c);
        p.draw(c);

        // Hearts
        for (
            const f of this.fx
        ) {

            c.globalAlpha =
                Math.min(
                    1,
                    f.l
                );

            heart(
                c,
                f.x,
                f.y,
                16,
                "#ff5082"
            );
        }

        c.globalAlpha = 1;

        // Fireflies
        for (
            let i = 0;
            i < 25;
            i++
        ) {

            const x =
                (
                    i * 53 +
                    t * 8 *
                    (1 + i % 3)
                ) % 1280;

            const y =
                250 +
                (i * 61) % 350 +
                Math.sin(
                    t + i
                ) * 15;

            c.fillStyle =
                `rgba(255,246,168,${0.4 + 0.4 * Math.sin(t * 2 + i)})`;

            c.beginPath();

            c.arc(
                x,
                y,
                2.5,
                0,
                7
            );

            c.fill();
        }

        c.restore();

        // Text
        c.fillStyle =
            "#fff";

        c.font =
            "bold 30px system-ui,sans-serif";

        c.textAlign =
            "center";

        c.shadowColor =
            "#000a";

        c.shadowBlur = 8;

        if (
            this.state === "walk"
        ) {

            c.fillText(
                "Іди вправо →",
                640,
                90
            );
        }

        if (
            this.state === "meet" &&
            this.st > 1.5
        ) {

            c.fillText(
                "Нарешті ми разом ❤️",
                640,
                100
            );
        }

        if (
            this.state === "done"
        ) {

            c.fillText(
                "Іди в портал →",
                640,
                100
            );
        }

        c.shadowBlur = 0;
        c.textAlign = "left";

        // Fade in
        if (t < 0.8) {

            c.fillStyle =
                `rgba(0,0,0,${1 - t / 0.8})`;

            c.fillRect(
                0,
                0,
                1280,
                720
            );
        }
    }
}


// ============================================================
// LOVE PLANET
// ============================================================

const PHOTOS = [
    {
        file: "assets/photos/photo1.jpg",
        caption: "Наше перше фото ❤️"
    }
];

const LW = 5000;

const PH = {
    x: 2400,
    y: 260
};

const LP = [
    [500, 510],
    [820, 420],
    [1150, 510],
    [1700, 500],
    [2000, 400],
    [2300, 310],
    [2650, 400],
    [3100, 500],
    [3450, 400],
    [3750, 310],
    [4050, 420]
];

const NG = [
    [300, 580],
    [560, 470],
    [880, 380],
    [1200, 470],
    [1500, 580],
    [1760, 460],
    [2060, 360],
    [2700, 360],
    [3150, 460],
    [3500, 360],
    [4100, 380],
    [4400, 580]
];

class LovePlanet {

    constructor(
        save,
        onSave,
        goto
    ) {

        Object.assign(this, {
            onSave,
            goto,

            t: 0,
            cam: 0,

            fx: [],
            sf: [],

            cnt: 0,

            view: 0,

            hc: 0,
            hh: 0,

            idle: 0,

            pi: true,
            pjp: true,

            shut: false,

            end: false,
            near: false,
            ok: false
        });

        this.ph =
            save.photos &&
            save.photos.planet
                ? "got"
                : "wait";

        this.solids = [
            {
                x: 0,
                y: GY,
                w: LW,
                h: 200
            },

            ...LP.map(
                ([x, y]) => ({
                    x,
                    y,
                    w: 200,
                    h: 20,
                    p: true
                })
            )
        ];

        this.ng =
            NG.map(
                ([x, y]) => ({
                    x,
                    y,
                    got: false
                })
            );

        this.p =
            new Player(
                120,
                GY
            );

        this.n =
            new Player(
                50,
                GY,
                "assets/characters/me_head.png",
                "#4a8fe0",
                false
            );

        this.img =
            new Image();

        this.img.onload =
            () => this.ok = true;

        this.img.src =
            PHOTOS[0].file;

        this.stars =
            Array.from(
                { length: 120 },
                (_, i) => ({
                    x:
                        (i * 211) %
                        1280,

                    y:
                        (i * 97) %
                        460,

                    r:
                        1 +
                        i % 3,

                    f:
                        0.5 +
                        i % 4 * 0.4
                })
            );

        this.ff =
            Array.from(
                { length: 30 },
                (_, i) => ({
                    x:
                        (i * 337) %
                        1380,

                    y:
                        150 +
                        (i * 91) %
                        450,

                    s:
                        0.6 +
                        (i % 5) * 0.2,

                    p: i
                })
            );

        const on = e => {

            if (
                e.type === "pointerdown" ||
                e.code === "Escape" ||
                e.code === "Enter"
            ) {
                this.shut = true;
            }
        };

        addEventListener(
            "keydown",
            on
        );

        document
            .getElementById("game")
            .addEventListener(
                "pointerdown",
                on
            );
    }

    update(dt, inp) {

        this.t += dt;

        const p = this.p;
        const n = this.n;

        const e =
            inp.interact &&
            !this.pi;

        const j =
            inp.jump &&
            !this.pjp;

        this.pi =
            inp.interact;

        this.pjp =
            inp.jump;

        if (
            this.ph === "view"
        ) {

            this.view += dt;
            this.hc -= dt;

            if (this.hc <= 0) {

                this.hc = 0.06;

                this.sf.push({
                    x:
                        Math.random() *
                        1280,

                    y: 740,

                    vy:
                        -130 -
                        Math.random() * 170,

                    l: 4,

                    s:
                        10 +
                        Math.random() * 16
                });
            }

            if (
                this.view > 0.9 &&
                (e || j || this.shut)
            ) {

                this.ph = "got";
            }

            this.shut = false;

        } else {

            p.update(
                dt,
                inp,
                this.solids
            );

            p.x =
                Math.max(
                    30,
                    Math.min(
                        LW - 30,
                        p.x
                    )
                );

            this.near =
                this.ph === "wait" &&
                Math.abs(
                    p.x - PH.x
                ) < 70 &&
                Math.abs(
                    p.y - 60 - PH.y
                ) < 100;

            if (
                this.near &&
                e
            ) {

                this.ph = "view";
                this.view = 0;
                this.shut = false;

                this.onSave({
                    photos: {
                        planet: true
                    }
                });
            }

            const d =
                p.x - n.x;

            const ad =
                Math.abs(d);

            let ax = 0;

            if (ad > 150) {
                ax = Math.sign(d);

            } else if (ad < 70) {

                ax =
                    -Math.sign(d) * 0.5;

            }

            if (
                Math.abs(p.vx) < 5 &&
                ad < 220 &&
                ad >= 70
            ) {
                ax = 0;
            }

            this.idle =
                ax
                    ? 0
                    : this.idle + dt;

            let jm =
                n.ground &&
                p.y < n.y - 60 &&
                ad < 300;

            if (this.idle > 5) {

                this.idle = 0;

                jm =
                    n.ground;
            }

            n.update(
                dt,
                {
                    ax,

                    run:
                        Math.abs(
                            p.vx
                        ) > 300 ||
                        ad > 420,

                    jump: jm,
                    attack: false
                },
                this.solids
            );

            n.x =
                Math.max(
                    30,
                    Math.min(
                        LW - 30,
                        n.x
                    )
                );

            if (ad > 1000) {

                n.x =
                    p.x - 80;

                n.y =
                    p.y;

                n.vy = 0;
            }

            if (!ax) {
                n.face =
                    Math.sign(d) || 1;
            }

            this.hh -= dt;

            if (
                !ax &&
                ad < 220 &&
                Math.abs(p.vx) < 5 &&
                this.hh <= 0
            ) {

                this.hh = 1.2;

                this.fx.push({
                    k: "h",

                    x:
                        (p.x + n.x) / 2,

                    y:
                        p.y - 150,

                    vy: -50,

                    l: 1.6
                });
            }

            // Nuggets
            for (
                const g of this.ng
            ) {

                if (
                    !g.got &&
                    Math.abs(
                        g.x - p.x
                    ) < 50 &&
                    Math.abs(
                        g.y -
                        (p.y - 55)
                    ) < 70
                ) {

                    g.got = true;

                    this.cnt++;

                    this.fx.push({
                        k: "t",

                        x: g.x,

                        y:
                            g.y - 20,

                        vy: -90,

                        l: 1,

                        tx: "+1"
                    });

                    for (
                        let i = 0;
                        i < 8;
                        i++
                    ) {

                        const a =
                            i / 8 *
                            6.283;

                        this.fx.push({
                            k: "s",

                            x: g.x,
                            y: g.y,

                            vx:
                                Math.cos(a) *
                                160,

                            vy:
                                Math.sin(a) *
                                160,

                            l: 0.6
                        });
                    }
                }
            }

            if (
                this.ph === "got" &&
                !this.end &&
                Math.abs(
                    p.x - 4700
                ) < 50
            ) {
                this.end = true;
            }
        }

        // Effects
        for (
            const f of this.fx
        ) {

            f.x +=
                (f.vx || 0) *
                dt;

            f.y +=
                f.vy * dt;

            f.l -= dt;
        }

        this.fx =
            this.fx.filter(
                f => f.l > 0
            );

        for (
            const f of this.sf
        ) {

            f.y +=
                f.vy * dt;

            f.l -= dt;
        }

        this.sf =
            this.sf.filter(
                f => f.l > 0
            );

        const tg =
            Math.max(
                0,
                Math.min(
                    LW - 1280,
                    p.x - 640
                )
            );

        this.cam +=
            (
                tg - this.cam
            ) *
            Math.min(
                1,
                dt * 5
            );
    }

    draw(c) {

        const t = this.t;
        const cam = this.cam;
        const p = this.p;

        const open =
            this.ph === "got";

        const dot =
            (x, y, r) => {

                c.beginPath();

                c.arc(
                    x,
                    y,
                    r,
                    0,
                    7
                );

                c.fill();
            };

        // Sky
        const g =
            c.createLinearGradient(
                0,
                0,
                0,
                720
            );

        g.addColorStop(
            0,
            "#1d0a3e"
        );

        g.addColorStop(
            0.5,
            "#7a2f93"
        );

        g.addColorStop(
            1,
            "#ff9ad0"
        );

        c.fillStyle = g;

        c.fillRect(
            0,
            0,
            1280,
            720
        );

        // Stars
        c.fillStyle =
            "#fff";

        for (
            const s of this.stars
        ) {

            c.globalAlpha =
                0.3 +
                0.7 *
                Math.abs(
                    Math.sin(
                        t * s.f +
                        s.x
                    )
                );

            c.fillRect(
                s.x,
                s.y,
                s.r,
                s.r
            );
        }

        c.globalAlpha = 1;

        // Planet
        const px =
            900 -
            cam * 0.06;

        const py = 290;

        const pg =
            c.createRadialGradient(
                px - 70,
                py - 70,
                20,
                px,
                py,
                230
            );

        pg.addColorStop(
            0,
            "#ffc2e6"
        );

        pg.addColorStop(
            0.6,
            "#d66ab8"
        );

        pg.addColorStop(
            1,
            "#6a2a8a"
        );

        c.fillStyle = pg;

        dot(
            px,
            py,
            220
        );

        heart(
            c,
            px + 10,
            py + 10,
            70,
            "rgba(255,255,255,.22)"
        );

        // Planet ring
        c.strokeStyle =
            "rgba(255,220,245,.45)";

        c.lineWidth = 14;

        c.beginPath();

        c.ellipse(
            px,
            py,
            340,
            62,
            -0.35,
            0,
            7
        );

        c.stroke();

        // Moon
        const mx =
            230 -
            cam * 0.04;

        c.fillStyle =
            "#fff6d8";

        dot(
            mx,
            150,
            48
        );

        c.fillStyle =
            "rgba(200,180,150,.5)";

        dot(
            mx - 14,
            140,
            10
        );

        dot(
            mx + 12,
            164,
            7
        );

        // Floating planets
        for (
            const [x, y, r, col] of [
                [430, 340, 26, "#7ad7ff"],
                [1120, 110, 18, "#ffd36b"],
                [620, 90, 14, "#b9a0ff"]
            ]
        ) {

            c.fillStyle = col;

            dot(
                x - cam * 0.1,
                y,
                r
            );
        }

        // Floating islands
        {
            const gap = 460;
            const off =
                cam * 0.25;

            const i0 =
                Math.floor(
                    off / gap
                );

            for (
                let i = i0;
                i <
                i0 + 4;
                i++
            ) {

                const x =
                    i * gap -
                    off +
                    (
                        i * 53 % 120
                    );

                const y =
                    380 +
                    (
                        i * 37 % 5
                    ) * 25;

                c.fillStyle =
                    "#4a2275";

                c.beginPath();

                c.moveTo(
                    x - 90,
                    y
                );

                c.lineTo(
                    x + 90,
                    y
                );

                c.lineTo(
                    x + 15,
                    y + 95
                );

                c.fill();

                c.fillStyle =
                    "#b86ad8";

                c.fillRect(
                    x - 90,
                    y - 8,
                    180,
                    10
                );

                c.fillStyle =
                    "rgba(255,170,230,.5)";

                dot(
                    x,
                    y - 38,
                    26
                );

                c.fillStyle =
                    "rgba(255,230,250,.8)";

                dot(
                    x,
                    y - 38,
                    13
                );
            }
        }

        // Glowing trees
        {
            const gap = 260;
            const off =
                cam * 0.6;

            const i0 =
                Math.floor(
                    off / gap
                );

            for (
                let i = i0;
                i <
                i0 + 6;
                i++
            ) {

                const x =
                    i * gap -
                    off +
                    (
                        i * 71 % 80
                    );

                const h =
                    110 +
                    (
                        i * 37 % 4
                    ) * 30;

                c.fillStyle =
                    "#3a1a5a";

                c.fillRect(
                    x - 7,
                    GY - h,
                    14,
                    h
                );

                c.fillStyle =
                    "rgba(255,155,224,.35)";

                dot(
                    x,
                    GY - h,
                    62
                );

                c.fillStyle =
                    "rgba(255,208,240,.7)";

                dot(
                    x,
                    GY - h,
                    34
                );
            }
        }

        c.save();

        c.translate(
            -cam,
            0
        );

        // Ground
        const gr =
            c.createLinearGradient(
                0,
                GY,
                0,
                720
            );

        gr.addColorStop(
            0,
            "#8a45b0"
        );

        gr.addColorStop(
            1,
            "#2a1050"
        );

        c.fillStyle = gr;

        c.fillRect(
            cam - 10,
            GY,
            1300,
            200
        );

        c.fillStyle =
            "#ff9be0";

        c.fillRect(
            cam - 10,
            GY,
            1300,
            6
        );

        // Crystals
        for (
            let x =
                Math.floor(
                    cam / 170
                ) * 170;

            x <
                cam + 1300;

            x += 170
        ) {

            const h =
                30 +
                (
                    (
                        x / 170 * 13
                    ) % 4
                ) * 14;

            c.fillStyle =
                x / 170 % 2
                    ? "#7ee8ff"
                    : "#ff8ae0";

            c.globalAlpha = 0.2;

            dot(
                x + 10,
                GY - h / 2,
                h * 0.8
            );

            c.globalAlpha = 0.9;

            c.beginPath();

            c.moveTo(
                x - 12,
                GY
            );

            c.lineTo(
                x,
                GY - h
            );

            c.lineTo(
                x + 12,
                GY
            );

            c.fill();

            c.globalAlpha = 1;
        }

        // Platforms
        for (
            const s of this.solids
        ) {

            if (!s.p) {
                continue;
            }

            c.fillStyle =
                "#4a2275";

            c.beginPath();

            c.moveTo(
                s.x,
                s.y + s.h
            );

            c.lineTo(
                s.x + s.w,
                s.y + s.h
            );

            c.lineTo(
                s.x +
                    s.w / 2 +
                    20,
                s.y +
                    s.h +
                    75
            );

            c.lineTo(
                s.x +
                    s.w / 2 -
                    25,
                s.y +
                    s.h +
                    60
            );

            c.fill();

            c.fillStyle =
                "#b86ad8";

            c.fillRect(
                s.x,
                s.y,
                s.w,
                s.h
            );

            c.fillStyle =
                "#ff9be0";

            c.fillRect(
                s.x,
                s.y,
                s.w,
                6
            );
        }

        // Nuggets
        c.font =
            "34px system-ui,sans-serif";

        c.textAlign =
            "center";

        for (
            const q of this.ng
        ) {

            if (!q.got) {

                const y =
                    q.y +
                    Math.sin(
                        t * 3 +
                        q.x
                    ) * 5;

                c.fillStyle =
                    "rgba(255,220,100,.25)";

                dot(
                    q.x,
                    y - 10,
                    26
                );

                c.fillStyle =
                    "#fff";

                c.fillText(
                    "🍗",
                    q.x,
                    y
                );
            }
        }

        // Photo
        if (
            this.ph === "wait"
        ) {

            const y =
                PH.y +
                Math.sin(
                    t * 2.5
                ) * 8;

            c.fillStyle =
                `rgba(255,200,240,${0.25 + 0.15 * Math.sin(t * 4)})`;

            dot(
                PH.x,
                y,
                48
            );

            c.fillStyle =
                "#fff";

            c.fillRect(
                PH.x - 24,
                y - 30,
                48,
                58
            );

            c.fillStyle =
                "#ffb3dc";

            c.fillRect(
                PH.x - 19,
                y - 25,
                38,
                38
            );

            c.fillStyle =
                "#fff";

            c.fillText(
                "📸",
                PH.x,
                y + 8
            );
        }

        // Portal
        c.fillStyle =
            open
                ? "#ff9be0"
                : "#555";

        c.globalAlpha =
            open
                ? 0.7 +
                    0.2 *
                    Math.sin(
                        t * 4
                    )
                : 0.6;

        c.beginPath();

        c.ellipse(
            4700,
            GY - 90,
            45,
            90,
            0,
            0,
            7
        );

        c.fill();

        c.globalAlpha = 1;

        this.n.draw(c);
        p.draw(c);

        // Effects
        for (
            const f of this.fx
        ) {

            c.globalAlpha =
                Math.max(
                    0,
                    Math.min(
                        1,
                        f.l
                    )
                );

            if (
                f.k === "h"
            ) {

                heart(
                    c,
                    f.x,
                    f.y,
                    14,
                    "#ff5082"
                );

            } else if (
                f.k === "t"
            ) {

                c.fillStyle =
                    "#fff3a0";

                c.font =
                    "bold 26px system-ui,sans-serif";

                c.fillText(
                    f.tx,
                    f.x,
                    f.y
                );

            } else {

                c.fillStyle =
                    "#fff6b0";

                c.beginPath();

                c.moveTo(
                    f.x,
                    f.y - 7
                );

                c.lineTo(
                    f.x + 3,
                    f.y
                );

                c.lineTo(
                    f.x,
                    f.y + 7
                );

                c.lineTo(
                    f.x - 3,
                    f.y
                );

                c.fill();
            }
        }

        c.globalAlpha = 1;

        c.restore();

        // Floating hearts
        for (
            let i = 0;
            i < 30;
            i++
        ) {

            const x =
                (i * 131) %
                    1280 +
                Math.sin(
                    t + i
                ) * 20;

            const y =
                720 -
                (
                    t *
                    20 *
                    (1 + i % 3) +
                    i * 83
                ) % 760;

            heart(
                c,
                x,
                y,
                7 + i % 3 * 2,
                "rgba(255,140,200,.35)"
            );
        }

        // Foreground glow
        const fg =
            c.createLinearGradient(
                0,
                470,
                0,
                720
            );

        fg.addColorStop(
            0,
            "rgba(255,170,230,0)"
        );

        fg.addColorStop(
            1,
            "rgba(255,170,230,.28)"
        );

        c.fillStyle = fg;

        c.fillRect(
            0,
            470,
            1280,
            250
        );

        // Fireflies
        for (
            const f of this.ff
        ) {

            const x =
                (
                    (
                        f.x -
                        cam * 0.9
                    ) % 1380 +
                    1380
                ) % 1380 - 50;

            const y =
                f.y +
                Math.sin(
                    t * f.s +
                    f.p
                ) * 20;

            const a =
                0.5 +
                0.5 *
                Math.sin(
                    t * 2 +
                    f.p
                );

            c.fillStyle =
                `rgba(255,246,168,${0.15 * a})`;

            dot(
                x,
                y,
                10
            );

            c.fillStyle =
                `rgba(255,250,200,${0.4 + 0.5 * a})`;

            dot(
                x,
                y,
                3
            );
        }

        // HUD
        c.textAlign =
            "left";

        c.fillStyle =
            "#fff";

        c.font =
            "bold 26px system-ui,sans-serif";

        c.shadowColor =
            "#0008";

        c.shadowBlur = 6;

        c.fillText(
            `🍗 Nuggets: ${this.cnt}/${NG.length}`,
            40,
            52
        );

        c.fillText(
            `📸 Photos: ${this.ph === "wait" ? 0 : 1}/1`,
            40,
            90
        );

        c.font =
            "20px system-ui,sans-serif";

        if (
            this.ph === "wait"
        ) {

            c.fillText(
                "Підказка: шукай там, де острів найвищий ✨",
                40,
                126
            );
        }

        c.textAlign =
            "center";

        c.font =
            "bold 28px system-ui,sans-serif";

        if (this.near) {

            c.fillText(
                "📸 Переглянути (E)",
                p.x - cam,
                p.y - 190
            );
        }

        if (this.end) {

            c.fillText(
                "🍳 Літня кухня Даші — наступний етап скоро ✨",
                640,
                100
            );

        } else if (
            p.x > 4200
        ) {

            c.fillText(
                open
                    ? "Іди в портал ✨"
                    : "🔒 Спочатку знайди наше фото 📸",
                640,
                100
            );
        }

        c.shadowBlur = 0;
        c.textAlign = "left";

        // Photo viewer
        if (
            this.ph === "view"
        ) {

            const v =
                this.view;

            const k =
                Math.min(
                    1,
                    v / 0.6
                );

            const e =
                1 +
                2.70158 *
                    Math.pow(
                        k - 1,
                        3
                    ) +
                1.70158 *
                    Math.pow(
                        k - 1,
                        2
                    );

            c.fillStyle =
                `rgba(10,0,30,${Math.min(.75, v * 2)})`;

            c.fillRect(
                0,
                0,
                1280,
                720
            );

            c.save();

            c.translate(
                640,
                370
            );

            c.rotate(
                -0.05 *
                (1 - k)
            );

            c.scale(
                e,
                e
            );

            c.shadowColor =
                "#000a";

            c.shadowBlur = 30;

            c.fillStyle =
                "#fff";

            c.fillRect(
                -280,
                -250,
                560,
                440
            );

            c.shadowBlur = 0;

            if (this.ok) {

                const iw =
                    this.img.width;

                const ih =
                    this.img.height;

                const s =
                    Math.min(
                        520 / iw,
                        350 / ih
                    );

                c.drawImage(
                    this.img,
                    -iw * s / 2,
                    -230 +
                        (
                            350 -
                            ih * s
                        ) / 2,
                    iw * s,
                    ih * s
                );

            } else {

                c.fillStyle =
                    "#ffd0e8";

                c.fillRect(
                    -260,
                    -230,
                    520,
                    350
                );

                c.fillStyle =
                    "#a03a80";

                c.font =
                    "bold 22px system-ui,sans-serif";

                c.textAlign =
                    "center";

                c.fillText(
                    "📸 Поклади фото в assets/photos/photo1.jpg",
                    0,
                    -50
                );
            }

            c.fillStyle =
                "#a03a80";

            c.font =
                "bold 30px system-ui,sans-serif";

            c.textAlign =
                "center";

            c.fillText(
                PHOTOS[0].caption,
                0,
                165
            );

            c.restore();

            // Photo particles
            for (
                const f of this.sf
            ) {

                heart(
                    c,
                    f.x,
                    f.y,
                    f.s,
                    `rgba(255,90,150,${Math.min(.85, f.l)})`
                );
            }

            c.fillStyle =
                "#fff";

            c.font =
                "bold 34px system-ui,sans-serif";

            c.textAlign =
                "center";

            c.fillText(
                "Ти знайшла наше фото! ❤️",
                640,
                60
            );

            if (
                v > 0.9
            ) {

                c.globalAlpha =
                    0.6 +
                    0.4 *
                    Math.sin(
                        t * 5
                    );

                c.font =
                    "22px system-ui,sans-serif";

                c.fillText(
                    "Натисни E, Space або тапни — продовжити",
                    640,
                    700
                );

                c.globalAlpha = 1;
            }

            c.textAlign =
                "left";
        }
    }
}


// ============================================================
// MAIN
// ============================================================

const KEY =
    "ola_save_v1";

const cv =
    document.getElementById(
        "game"
    );

const ctx =
    cv.getContext("2d");

let save = {};

try {

    save =
        JSON.parse(
            localStorage.getItem(
                KEY
            )
        ) || {};

} catch (e) {}

const store = () => {

    try {

        localStorage.setItem(
            KEY,
            JSON.stringify(save)
        );

    } catch (e) {}
};

const onSave = s => {

    save = {
        ...save,
        ...s
    };

    store();
};


// ============================================================
// CANVAS SIZE
// ============================================================

function fit() {

    const s =
        Math.min(
            innerWidth / 1280,
            innerHeight / 720
        );

    cv.style.width =
        1280 * s + "px";

    cv.style.height =
        720 * s + "px";
}

addEventListener(
    "resize",
    fit
);

fit();

initTouch();


// ============================================================
// GAME LOOP
// ============================================================

let scene = null;
let last = 0;
let acc = 0;
let running = false;

const STEP =
    1 / 60;

function goScene(n) {

    onSave({
        level: n
    });

    scene =
        n === "meeting"
            ? new Meeting(
                save,
                onSave,
                goScene
            )
            : n === "planet"
                ? new LovePlanet(
                    save,
                    onSave,
                    goScene
                )
                : new Forest(
                    save,
                    onSave,
                    goScene
                );
}

function loop(t) {

    requestAnimationFrame(
        loop
    );

    const dt =
        Math.min(
            0.1,
            (t - last) / 1000 || 0
        );

    last = t;
    acc += dt;

    poll();

    while (
        acc >= STEP
    ) {

        scene.update(
            STEP,
            input
        );

        acc -= STEP;
    }

    scene.draw(
        ctx
    );
}


// ============================================================
// START GAME
// ============================================================

function startGame() {

    try {

        (
            window.audioCtx =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )()
        ).resume();

    } catch (e) {}

    document
        .getElementById(
            "start"
        )
        .style.display = "none";

    document.body
        .classList
        .add("playing");

    goScene(
        location.hash === "#planet"
            ? "planet"
            : location.hash === "#meeting"
                ? "meeting"
                : (
                    save.level ||
                    "forest"
                )
    );

    if (!running) {

        running = true;

        requestAnimationFrame(
            loop
        );
    }
}
